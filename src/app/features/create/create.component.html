<section class="create-section">
  <div class="create-card">
    <h1>Create Post</h1>
    <p class="subtitle">Share a new game article with the community.</p>

    @if (errorMessage) {
      <p class="server-error">{{ errorMessage }}</p>
    }

    <app-post-form
      [submitLabel]="'Create Post'"
      [isSubmitting]="isSubmitting"
      (formSubmit)="onCreate($event)">
    </app-post-form>
  </div>
</section>
