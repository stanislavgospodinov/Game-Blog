<section class="edit-section">
  <div class="edit-card">
    <h1>Edit Post</h1>
    <p class="subtitle">Update your game post information.</p>

    @if (isLoading) {
      <div class="info-box">
        <p>Loading post...</p>
      </div>
    } @else if (errorMessage && !postData) {
      <div class="info-box error-box">
        <p>{{ errorMessage }}</p>
      </div>
    } @else if (postData) {
      @if (errorMessage) {
        <p class="server-error">{{ errorMessage }}</p>
      }

      <app-post-form
        [initialData]="postData"
        [submitLabel]="'Save Changes'"
        [isSubmitting]="isSubmitting"
        (formSubmit)="onEdit($event)">
      </app-post-form>

      <a [routerLink]="['/posts', postId]" class="cancel-btn">Cancel</a>
    }
  </div>
</section>
